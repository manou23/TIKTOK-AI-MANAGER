name: Deploy TikTok Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate deployment secrets and configure KV
        working-directory: server/tiktok-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TIKTOK_KV_NAMESPACE_ID: ${{ secrets.TIKTOK_KV_NAMESPACE_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REDIRECT_URI: ${{ secrets.TIKTOK_REDIRECT_URI }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_REDIRECT_URI: ${{ secrets.META_REDIRECT_URI }}
          META_GRAPH_API_VERSION: ${{ secrets.META_GRAPH_API_VERSION }}
          MEDIA_PUBLIC_BASE_URL: ${{ secrets.MEDIA_PUBLIC_BASE_URL }}
          INSTAGRAM_R2_BUCKET_NAME: ${{ secrets.INSTAGRAM_R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TIKTOK_KV_NAMESPACE_ID TIKTOK_CLIENT_KEY TIKTOK_CLIENT_SECRET TIKTOK_REDIRECT_URI TOKEN_ENCRYPTION_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          if ! [[ "$TIKTOK_KV_NAMESPACE_ID" =~ ^[A-Za-z0-9_-]{20,64}$ ]]; then
            echo "::error::TIKTOK_KV_NAMESPACE_ID does not look like a Cloudflare KV namespace ID"
            exit 1
          fi
          if ! [[ "$TOKEN_ENCRYPTION_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::TOKEN_ENCRYPTION_KEY must be 64 hexadecimal characters"
            exit 1
          fi
          sed -i "s/REPLACE_WITH_YOUR_CLOUDFLARE_KV_NAMESPACE_ID/$TIKTOK_KV_NAMESPACE_ID/" wrangler.toml
          IG_COUNT=0
          for name in META_APP_ID META_APP_SECRET META_REDIRECT_URI MEDIA_PUBLIC_BASE_URL INSTAGRAM_R2_BUCKET_NAME; do
            if [ -n "${!name}" ]; then IG_COUNT=$((IG_COUNT + 1)); fi
          done
          if [ "$IG_COUNT" -ne 0 ] && [ "$IG_COUNT" -ne 5 ]; then
            echo "::error::Configure all five Instagram secrets together: META_APP_ID, META_APP_SECRET, META_REDIRECT_URI, MEDIA_PUBLIC_BASE_URL, INSTAGRAM_R2_BUCKET_NAME"
            exit 1
          fi
          if [ "$IG_COUNT" -eq 5 ]; then
            if ! [[ "$META_REDIRECT_URI" =~ ^https://.*/instagram/oauth/callback$ ]]; then
              echo "::error::META_REDIRECT_URI must end with /instagram/oauth/callback and use HTTPS"
              exit 1
            fi
            if ! [[ "$MEDIA_PUBLIC_BASE_URL" =~ ^https:// ]]; then
              echo "::error::MEDIA_PUBLIC_BASE_URL must use HTTPS"
              exit 1
            fi
            META_GRAPH_API_VERSION="${META_GRAPH_API_VERSION:-v26.0}"
            echo "META_GRAPH_API_VERSION=$META_GRAPH_API_VERSION" >> "$GITHUB_ENV"
            echo "INSTAGRAM_ENABLED=true" >> "$GITHUB_ENV"
            cat >> wrangler.toml <<EOF
          [[r2_buckets]]
          binding = "MEDIA_BUCKET"
          bucket_name = "$INSTAGRAM_R2_BUCKET_NAME"
          EOF
          else
            echo "INSTAGRAM_ENABLED=false" >> "$GITHUB_ENV"
          fi

      - name: Install Worker tooling
        working-directory: server/tiktok-worker
        run: npm install

      - name: Create Instagram R2 bucket when configured
        working-directory: server/tiktok-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INSTAGRAM_R2_BUCKET_NAME: ${{ secrets.INSTAGRAM_R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          if [ "${INSTAGRAM_ENABLED:-false}" = "true" ]; then
            if ! npx wrangler r2 bucket list | grep -Fq "$INSTAGRAM_R2_BUCKET_NAME"; then
              npx wrangler r2 bucket create "$INSTAGRAM_R2_BUCKET_NAME"
            fi
          fi

      - name: Upload encrypted runtime secrets to Cloudflare
        working-directory: server/tiktok-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REDIRECT_URI: ${{ secrets.TIKTOK_REDIRECT_URI }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_REDIRECT_URI: ${{ secrets.META_REDIRECT_URI }}
          META_GRAPH_API_VERSION: ${{ secrets.META_GRAPH_API_VERSION }}
          MEDIA_PUBLIC_BASE_URL: ${{ secrets.MEDIA_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          printf '%s' "$TIKTOK_CLIENT_KEY" | npx wrangler secret put TIKTOK_CLIENT_KEY
          printf '%s' "$TIKTOK_CLIENT_SECRET" | npx wrangler secret put TIKTOK_CLIENT_SECRET
          printf '%s' "$TIKTOK_REDIRECT_URI" | npx wrangler secret put TIKTOK_REDIRECT_URI
          printf '%s' "$TOKEN_ENCRYPTION_KEY" | npx wrangler secret put TOKEN_ENCRYPTION_KEY
          if [ "${INSTAGRAM_ENABLED:-false}" = "true" ]; then
            printf '%s' "$META_APP_ID" | npx wrangler secret put META_APP_ID
            printf '%s' "$META_APP_SECRET" | npx wrangler secret put META_APP_SECRET
            printf '%s' "$META_REDIRECT_URI" | npx wrangler secret put META_REDIRECT_URI
            printf '%s' "${META_GRAPH_API_VERSION:-v26.0}" | npx wrangler secret put META_GRAPH_API_VERSION
            printf '%s' "$MEDIA_PUBLIC_BASE_URL" | npx wrangler secret put MEDIA_PUBLIC_BASE_URL
          fi

      - name: Deploy Worker
        working-directory: server/tiktok-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify Worker health
        env:
          TIKTOK_WORKER_URL: ${{ secrets.TIKTOK_WORKER_URL }}
        run: |
          set -euo pipefail
          if [ -z "$TIKTOK_WORKER_URL" ]; then
            echo "::warning::Worker deployed. Add TIKTOK_WORKER_URL after reading the workers.dev URL in the deploy log, then run the Android APK workflow."
            exit 0
          fi
          curl --fail --silent --show-error "${TIKTOK_WORKER_URL%/}/health"
